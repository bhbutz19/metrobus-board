---
deployment:
  tasks:
    # Replace CPANEL_USERNAME and confirm the bus subdomain's document root before deployment.
    - export DEPLOYPATH=/home/CPANEL_USERNAME/public_html/bus/
    - /bin/mkdir -p "$DEPLOYPATH/api"
    - /bin/cp index.html "$DEPLOYPATH/index.html"
    - /bin/cp api/arrivals.php "$DEPLOYPATH/api/arrivals.php"
