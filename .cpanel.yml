---
deployment:
  tasks:
    # Verified cPanel document root for bus.cowboybutz.com.
    - export DEPLOYPATH=/home/cowboybu/public_html/bus.cowboybutz.com/
    - /bin/mkdir -p "$DEPLOYPATH/api"
    - /bin/cp index.html "$DEPLOYPATH/index.html"
    - /bin/cp bus-icon.svg "$DEPLOYPATH/bus-icon.svg"
    - /bin/cp site.webmanifest "$DEPLOYPATH/site.webmanifest"
    - /bin/cp api/arrivals.php "$DEPLOYPATH/api/arrivals.php"
    - /bin/cp api/schedule.php "$DEPLOYPATH/api/schedule.php"
    - /bin/cp api/stop.php "$DEPLOYPATH/api/stop.php"
